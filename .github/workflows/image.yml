# Pull requests only build the image. A release is started by hand: Actions tab > image > Run workflow on main, enter a version (e.g. 1.0.1).
# That one run then pushes the image to GHCR and Docker Hub, creates the v<version> tag and GitHub Release, and syncs the Docker Hub description.
name: image
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 1.0.1). Leave empty to only test-build."
        required: false
        type: string
permissions:
  contents: write   # creates the tag and release
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new release on its own schedule
    env:
      VERSION: ${{ inputs.version }}
      RELEASE: ${{ inputs.version != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release request
        if: env.RELEASE == 'true'
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3 (no leading v)"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::releases must be run from main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "::error::tag v$VERSION already exists"; exit 1; fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags: 1.2.3 / 1.2 / latest for releases; pr-N for pull requests and the branch name for test builds (those are never pushed).
      # (Do not put comments inside the tags block below: it is a string, not YAML.)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/desoky725/ttyd-tabs
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=ref,event=pr
            type=ref,event=branch,enable=${{ inputs.version == '' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.version != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Everything below runs only after the images were pushed successfully.
      - name: Create tag and GitHub Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Sync Docker Hub description
        if: env.RELEASE == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: desoky725/ttyd-tabs
          readme-filepath: ./README.md
