# tmux as an invisible persistence layer for ttyd-ui. Written for tmux 3.0a (Ubuntu 20.04 base image).

# No tmux UI: no status bar, no prefix key. (The prefix is disabled so C-b etc. pass through untouched
# to an inner/remote tmux, vim, readline...)
set -g status off
set -g prefix None
unbind C-b

set -sg escape-time 0
set -g mouse off
set -g history-limit 50000
set -g focus-events on
set -g aggressive-resize on

# Colour: truecolor to the outer terminal (xterm.js).
# TERM inside tmux stays xterm-256color (not screen/tmux-*): the stock Debian/Ubuntu bash prompt only sets the
# terminal title when TERM matches xterm*, and the tab titles depend on that (locally and on the SSH target).
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Titles: pass the pane/OSC title through to xterm.js (the tab title follows it).
set -g set-titles on
set -g set-titles-string "#T"
set -g allow-rename on

# OSC 52 clipboard: accept from inner apps and forward to the outer terminal.
set -g set-clipboard on   # (tmux's built-in xterm* override already provides the Ms/OSC 52 capability)

# tmux itself uses the alternate screen, so the browser's own scrollback is empty and the mouse wheel would be
# useless. ttyd-ui turns wheel events into these keys (Alt+PageUp / Alt+PageDown / Alt+End), sent 8 ms apart
# (tmux 3.0a mishandles back-to-back sequences), and tmux decides what they mean:
#   - pane is in copy-mode            -> scroll its history (leaves automatically at the bottom: -e)
#   - an app owns the alternate screen (less, vim, man...) -> send it Up/Down arrows, like xterm.js would
#   - plain shell screen              -> enter copy-mode and scroll history
# mouse stays off so native text selection keeps working. M-End leaves copy-mode (sent before typing).
bind -n M-PageUp   if -F '#{pane_in_mode}' 'send-keys -X -N 3 scroll-up'   'if -F "#{alternate_on}" "send-keys -N 3 Up" "copy-mode -e ; send-keys -X -N 3 scroll-up"'
bind -n M-PageDown if -F '#{pane_in_mode}' 'send-keys -X -N 3 scroll-down' 'if -F "#{alternate_on}" "send-keys -N 3 Down" ""'
bind -n M-End      if -F '#{pane_in_mode}' 'send-keys -X cancel'           ''
