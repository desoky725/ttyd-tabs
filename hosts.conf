# Saved hosts for the "+" menu of the web terminal. Read by ttyd-session inside the container (mounted at
# /etc/ttyd-hosts, read-only). Browser clients only ever send the KEY; the command below is run by the server.
#
#   key | label | command
#
# key: a-z 0-9 _ - (max 32 chars). label: shown in the menu. command: run by `sh -c` inside tmux; when it
# exits, the tab ends. Lines starting with # and blank lines are ignored. The built-in "Default (login)" entry
# (/login.sh) is always available and is not listed here.
#
# Examples (uncomment and edit):
# nas      | NAS            | ssh admin@nas.lan
# pi       | Raspberry Pi   | ssh -p 2222 pi@192.168.1.50
# docker   | Docker host    | ssh user@host.docker.internal
